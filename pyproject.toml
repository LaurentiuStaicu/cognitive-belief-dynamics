[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cognitive-belief-dynamics"
dynamic = ["version"]
description = "Computational engine and calibration artifacts for Cognitive Belief Dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Laurentiu Staicu"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "jsonschema>=4.22",
]

[project.scripts]
cemodel = "cognitive_epistemic_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_epistemic_model"]

[tool.hatch.build.targets.wheel.force-include]
"model" = "cognitive_epistemic_model/data/model"
"schemas" = "cognitive_epistemic_model/data/schemas"

[tool.hatch.version]
path = "src/cognitive_epistemic_model/__init__.py"
