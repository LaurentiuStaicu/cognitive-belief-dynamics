name: Bug / reproducibility problem
description: Report a reproducible CBD package, test, script, schema, or retained-benchmark problem.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: CBD version or commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12.x"
  - type: textarea
    id: command
    attributes:
      label: Command or test
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran or identified the relevant existing test/benchmark.
          required: true
        - label: This issue does not contain sensitive vulnerability details.
          required: true
