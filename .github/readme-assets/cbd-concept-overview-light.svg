<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Belief Dynamics conceptual structure</title>
  <desc id="desc">CBD maintains persistent agent states that are updated by ordered events through memory, decay, nonlinear transformations and stochastic decisions. Evidence is separated into executable, empirical, conceptual and interpretive levels. Synthetic model-recovery benchmarks remain distinct from human validation. CBD is not currently a formal System Dynamics model.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#707070"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="380" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#333333">CBD conceptual structure</text>
    <text x="380" y="68" text-anchor="middle" font-size="18" fill="#707070">agent state → ordered events → state updates → evidence levels → validation boundary</text>

    <rect x="70" y="105" width="620" height="102" rx="8" fill="#ffffff" stroke="#707070" stroke-width="2"/>
    <text x="105" y="139" font-size="24" font-weight="700" fill="#333333">Persistent agent state</text>
    <text x="105" y="170" font-size="18" fill="#707070">belief-related states · familiarity · memory · source estimates</text>
    <text x="105" y="196" font-size="17" fill="#707070">state persists between discrete evidence / information events</text>

    <line x1="380" y1="207" x2="380" y2="242" stroke="#707070" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="232" font-size="16" fill="#707070">updated by ordered events</text>

    <rect x="70" y="255" width="620" height="102" rx="8" fill="#ffffff" stroke="#707070" stroke-width="2"/>
    <text x="105" y="289" font-size="23" font-weight="700" fill="#333333">Event-driven update layer</text>
    <text x="105" y="320" font-size="18" fill="#707070">exposure · access · correction · presentation · evidence updates</text>
    <text x="105" y="346" font-size="17" fill="#707070">event schedule remains externally supplied in the current model</text>

    <line x1="380" y1="357" x2="380" y2="392" stroke="#707070" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="382" font-size="16" fill="#707070">transformed through</text>

    <rect x="70" y="405" width="620" height="102" rx="8" fill="#ffffff" stroke="#707070" stroke-width="2"/>
    <text x="105" y="439" font-size="23" font-weight="700" fill="#333333">Memory, decay &amp; nonlinear dynamics</text>
    <text x="105" y="470" font-size="18" fill="#707070">saturation · decay · nonlinear transforms · stochastic decisions</text>
    <text x="105" y="496" font-size="17" fill="#707070">dynamical behavior without claiming closed endogenous SD loops</text>

    <line x1="380" y1="507" x2="380" y2="542" stroke="#707070" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="532" font-size="16" fill="#707070">interpreted by evidence level</text>

    <rect x="70" y="555" width="620" height="112" rx="8" fill="#ffffff" stroke="#707070" stroke-width="2"/>
    <text x="105" y="589" font-size="23" font-weight="700" fill="#333333">Evidence &amp; epistemic levels</text>
    <text x="105" y="620" font-size="18" fill="#707070">EXECUTABLE · EMPIRICAL · CONCEPTUAL · INTERPRETIVE</text>
    <text x="105" y="644" font-size="17" fill="#707070">MOD.14 normative Bayesian reference ≠ literal brain mechanism</text>
    <text x="105" y="662" font-size="17" fill="#707070">uncertainty tracking ≠ truth certification</text>

    <line x1="380" y1="667" x2="380" y2="702" stroke="#707070" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="692" font-size="16" fill="#707070">bounded by validation status</text>

    <rect x="70" y="715" width="620" height="92" rx="8" fill="#ffffff" stroke="#707070" stroke-width="2"/>
    <text x="105" y="749" font-size="23" font-weight="700" fill="#333333">Validation boundary</text>
    <text x="105" y="780" font-size="18" fill="#707070">synthetic recovery / identifiability ≠ human validation</text>
    <text x="105" y="802" font-size="17" fill="#707070">Pencode not identified · participant recruitment not authorized</text>

    <rect x="145" y="819" width="470" height="28" rx="14" fill="#333333"/>
    <text x="380" y="839" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Event-driven dynamical model · not formal System Dynamics</text>
  </g>
</svg>
