name: M1.E4 trial-count refinement benchmark

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-g-trial-count-refinement

permissions:
  contents: read

jobs:
  targeted-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install .
      - name: Verify controlled single-axis change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          core = json.loads(Path("model/benchmarks/m1_e4_candidate_recovery_core.json").read_text())
          ref = json.loads(Path("model/benchmarks/m1_e4_candidate_recovery_trial_count_refinement.json").read_text())

          assert ref["trial_counts_per_operating_point"] == [480, 640, 960]
          for key in (
              "seed",
              "replicates",
              "recovery_threshold",
              "bias_grids",
              "memory_grids",
              "selection_rule",
          ):
              assert ref[key] == core[key], key

          print("controlled_axis: trial_counts_per_operating_point")
          print("reference:", core["trial_counts_per_operating_point"])
          print("refinement:", ref["trial_counts_per_operating_point"])
          PY
      - name: Run frozen targeted refinement
        run: |
          mkdir -p artifacts
          python scripts/run_m1_e4_candidate_recovery.py \
            --config model/benchmarks/m1_e4_candidate_recovery_trial_count_refinement.json \
            --output artifacts/m1_e4_trial_count_refinement_authoritative.json
      - name: Audit refinement result
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          p = Path("artifacts/m1_e4_trial_count_refinement_authoritative.json")
          d = json.loads(p.read_text())

          print("benchmark_id:", d["benchmark_id"])
          print("seed:", d["seed"])
          print("replicates_per_grid_cell:", d["replicates_per_grid_cell"])
          print("minimum_grid_recovery_probability:", d["minimum_grid_recovery_probability"])
          print("all_core_grid_cells_pass:", d["all_core_grid_cells_pass"])
          print("confusion_probability:")
          print(json.dumps(d["confusion_probability"], indent=2, sort_keys=True))

          by_n = defaultdict(list)
          for row in d["grid_results"]:
              by_n[row["n_target_per_operating_point"]].append(row)

          for n in sorted(by_n):
              rows = by_n[n]
              print(
                  "trial_count",
                  n,
                  "min_recovery",
                  min(r["recovery_probability"] for r in rows),
                  "pass_cells",
                  sum(r["passes_recovery_threshold"] for r in rows),
                  "/",
                  len(rows),
              )
              for row in rows:
                  if not row["passes_recovery_threshold"]:
                      print("FAILED", json.dumps(row, sort_keys=True))

          assert d["seed"] == 20260916
          assert d["replicates_per_grid_cell"] == 200
          assert len(d["grid_results"]) == 18
          PY
      - name: Create SHA-256 checksum
        run: |
          sha256sum artifacts/m1_e4_trial_count_refinement_authoritative.json \
            > artifacts/m1_e4_trial_count_refinement_authoritative.sha256
          cat artifacts/m1_e4_trial_count_refinement_authoritative.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-e4-trial-count-refinement
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
