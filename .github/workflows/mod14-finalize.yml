name: MOD14 final branch validation

on:
  push:
    branches: [mod14-world-model-construction]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply final MOD.14 semantic corrections
        run: python .github/scripts/mod14_finalize.py
      - name: Install Python package and validate MOD.14
        run: |
          python -m pip install -e .
          python scripts/export_semantic.py
          python scripts/export_web.py
          python -m pytest -q tests/test_world_model.py tests/test_world_model_contract.py tests/test_semantic_compiler.py
      - name: Validate web integration
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Remove one-shot helpers and untracked generated copies
        run: |
          rm -rf web/public/theory
          rm -f web/public/model/active_understanding.json
          rm -f web/public/model/decision_uncertainty.json
          rm -f web/public/model/world_model_v1.json
          rm -f .github/scripts/mod14_integrate.py .github/workflows/mod14-integrate.yml
          rm -f .github/scripts/mod14_finalize.py .github/workflows/mod14-finalize.yml
      - name: Commit validated MOD.14 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MOD14: finalize scientific boundaries and validated integration'
          git push
