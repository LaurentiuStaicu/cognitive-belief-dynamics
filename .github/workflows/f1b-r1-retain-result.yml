name: F1b R1 retain design-size result

on:
  push:
    branches:
      - research/f1b-r1-retain-run-2026-09-26

permissions:
  contents: write
  actions: read

jobs:
  retain:
    name: Retain verified R1 design-size result
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean result branch
        uses: actions/checkout@v7
        with:
          ref: research/f1b-r1-design-size-result-2026-09-26
          fetch-depth: 0

      - name: Download serial and matrix artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/serial /tmp/matrix
          gh run download 36258023526 -n f1b-r1-design-size-search-result -D /tmp/serial
          gh run download 36258243687 -n f1b-r1-design-size-search-result -D /tmp/matrix

      - name: Verify exact scientific equality
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          s = json.loads(Path("/tmp/serial/f1b_r1_design_size_search_result.json").read_text())
          m = json.loads(Path("/tmp/matrix/f1b_r1_design_size_search_result.json").read_text())
          assert s["status"] == "NON_AUTHORITATIVE_R1_DESIGN_SIZE_SEARCH_RESULT"
          assert s["authoritative"] is False
          assert s["replicates_per_cell"] == 200
          assert s["provenance"]["source_commit"] == "a4ed691e96f49449bdb50d565293da5ce41c61e2"
          assert s["provenance"]["config_sha256"] == "0b68b1894ac6127d4be41c41bb46a59d2ce8eb759fa6d772aa6d9579264ae358"
          assert s["provenance"]["replicate_override"] is None
          a = copy.deepcopy(s)
          b = copy.deepcopy(m)
          a.pop("provenance", None)
          b.pop("provenance", None)
          assert a == b
          assert m["provenance"]["source_commit"] == s["provenance"]["source_commit"]
          assert m["provenance"]["config_sha256"] == s["provenance"]["config_sha256"]
          assert m["provenance"]["replicate_override"] is None
          out = Path("model/results/f1b_r1_design_size_search_non_authoritative_2026-09-26.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(Path("/tmp/serial/f1b_r1_design_size_search_result.json").read_text())
          PY

      - name: Commit exact retained JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/results/f1b_r1_design_size_search_non_authoritative_2026-09-26.json
          git diff --cached --check
          git commit -m "F1b R1: retain design-size recovery search result"
          git push origin HEAD:research/f1b-r1-design-size-result-2026-09-26
