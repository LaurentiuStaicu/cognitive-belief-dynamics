name: F1b non-authoritative characterization run

on:
  push:
    branches:
      - research/f1b-characterization-run-2026-09-26
    paths:
      - .github/workflows/f1b-characterization-run.yml

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out characterization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run frozen non-authoritative characterization with 30 replicates
        run: |
          mkdir -p model/results
          python scripts/run_f1b_recovery_characterization.py \
            --config model/benchmarks/f1b_recovery_characterization.json \
            --replicates 30 \
            --output model/results/f1b_recovery_characterization_non_authoritative_r30_2026-09-26.json \
            --source-commit 938f72789e883ff5e98c4edc58ffbf3ced84fc93

      - name: Build compact retained summary
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          result_path = Path("model/results/f1b_recovery_characterization_non_authoritative_r30_2026-09-26.json")
          result = json.loads(result_path.read_text(encoding="utf-8"))

          def aggregate(keys):
              out = {}
              for row in result["grid_results"]:
                  key = tuple(row[k] for k in keys)
                  a = out.setdefault(key, {"n":0,"c":0.0,"w":0.0,"i":0.0,"f":0.0})
                  n = int(row["replicates"])
                  a["n"] += n
                  a["c"] += row["recovery_probability"] * n
                  a["w"] += row["wrong_probability"] * n
                  a["i"] += row["inconclusive_probability"] * n
                  a["f"] += row["fit_failure_probability"] * n
              return out

          agg = aggregate(("problem","inference"))
          reg = aggregate(("problem","separation_regime","inference"))
          gen = aggregate(("problem","generator","inference"))

          lines = [
              "# F1b Recovery Characterization Result — 30 replicates/cell — 2026-09-26",
              "",
              "Status: **NON_AUTHORITATIVE_CHARACTERIZATION_RESULT**",
              "",
              "Scientific source commit: `938f72789e883ff5e98c4edc58ffbf3ced84fc93`",
              "",
              f"Replicates per cell: **{result['replicates_per_cell']}**",
              "",
              "This retained run does not freeze the authoritative core grid, human N, or the final inference method.",
              "",
              "## Aggregate recovery by problem and inference",
              "",
              "| Problem | Inference | N | Correct | Wrong | Inconclusive | Fit failure |",
              "| --- | --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          for key, a in sorted(agg.items()):
              n=a["n"]
              lines.append(f"| {key[0]} | {key[1]} | {n} | {a['c']/n:.3f} | {a['w']/n:.3f} | {a['i']/n:.3f} | {a['f']/n:.3f} |")

          lines += [
              "",
              "## Recovery by separation regime",
              "",
              "| Problem | Regime | Inference | N | Correct | Wrong | Inconclusive | Fit failure |",
              "| --- | --- | --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          for key, a in sorted(reg.items()):
              n=a["n"]
              lines.append(f"| {key[0]} | {key[1]} | {key[2]} | {n} | {a['c']/n:.3f} | {a['w']/n:.3f} | {a['i']/n:.3f} | {a['f']/n:.3f} |")

          lines += [
              "",
              "## Recovery by generator",
              "",
              "| Problem | Generator | Inference | N | Correct | Wrong | Inconclusive | Fit failure |",
              "| --- | --- | --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          for key, a in sorted(gen.items()):
              n=a["n"]
              lines.append(f"| {key[0]} | {key[1]} | {key[2]} | {n} | {a['c']/n:.3f} | {a['w']/n:.3f} | {a['i']/n:.3f} | {a['f']/n:.3f} |")

          lines += [
              "",
              "## Interpretation boundary",
              "",
              result["interpretation_boundary"],
              "",
              "No scientific promotion is authorized by this run.",
          ]
          Path("docs/F1B_RECOVERY_CHARACTERIZATION_RESULT_R30_2026-09-26.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY

      - name: Commit retained 30-replicate non-authoritative result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             model/results/f1b_recovery_characterization_non_authoritative_r30_2026-09-26.json             docs/F1B_RECOVERY_CHARACTERIZATION_RESULT_R30_2026-09-26.md
          git commit -m "F1b: retain 30-replicate non-authoritative characterization"
          git push
