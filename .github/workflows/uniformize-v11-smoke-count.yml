name: Temporary InfoClar smoke count patch

on:
  push:
    branches:
      - uniformize-infoclar-v1-1-shell
    paths:
      - .github/workflows/uniformize-v11-smoke-count.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: uniformize-infoclar-v1-1-shell
          fetch-depth: 0
      - name: Align smoke assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('web/scripts/smoke.mjs')
          source=path.read_text()
          old="assert.equal(await page.locator('[data-understanding-mode]').count(),4);"
          new="assert.equal(await page.locator('[data-understanding-mode]').count(),5);"
          assert old in source
          path.write_text(source.replace(old,new,1))
          PY
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scripts/smoke.mjs
          git commit -m "Tests: align smoke with simplified model return path"
          git push origin HEAD:uniformize-infoclar-v1-1-shell
