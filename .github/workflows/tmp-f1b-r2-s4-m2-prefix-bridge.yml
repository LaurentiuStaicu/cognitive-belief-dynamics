name: TEMP F1b R2 S4 M2 prefix bridge

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    name: Validate retained M2 prefix reuse in S4
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt
      OPENBLAS_CORETYPE: Haswell

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt .

      - name: Download exact retained H1 source
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-homogeneous-h1-combined
          path: /tmp/h1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36401867007

      - name: Download exact retained M1 source
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-m1-combined
          path: /tmp/m1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36439940794

      - name: Download exact retained M2 source
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-m2-combined
          path: /tmp/m2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36450594439

      - name: Download exact retained S4 matrix source
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-s4-broad-scientific-matrix
          path: /tmp/s4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36463026247

      - name: Execute exact M2 to S4 prefix bridge
        run: |
          python scripts/build_f1b_r2_s4_m2_prefix_bridge.py \
            --h1-source /tmp/h1/f1b-r2-homogeneous-h1-combined.json \
            --m1-source /tmp/m1/f1b-r2-m1-combined.json \
            --m2-source /tmp/m2/f1b-r2-m2-combined.json \
            --s4-manifest /tmp/s4/f1b-r2-s4-broad-scientific-matrix.json \
            --output /tmp/f1b-r2-s4-m2-prefix-bridge.json

      - name: Enforce prefix bridge contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/f1b-r2-s4-m2-prefix-bridge.json").read_text(
                  encoding="utf-8"
              )
          )
          assert data["status"] == (
              "NON_AUTHORITATIVE_S4_M2_PREFIX_BRIDGE_COMPLETE"
          )
          assert data["imported_scientific_run_count"] == 840
          assert data["imported_method_row_count"] == 3360
          assert data["imported_departure_scientific_run_count"] == 720
          assert data["imported_null_scientific_run_count"] == 120
          assert data["terminal_status_counts"] == {
              "SEQUENTIAL_RESOLVED_AT_PREFIX": 2402,
              "SEQUENTIAL_RESOLVED": 834,
              "SEQUENTIAL_UNRESOLVED_AT_CAP": 124,
              "BOOTSTRAP_REFIT_FAILURE_UNRESOLVED": 0,
          }
          assert data["new_scientific_run_count"] == 14160
          assert data["new_method_execution_count"] == 56640
          assert data["wave0_new_method_executions"] == 11640
          assert data["wave1_new_method_executions"] == 15000
          assert data["wave2_new_method_executions"] == 15000
          assert data["wave3_new_method_executions"] == 15000
          assert data["prefix_import_authorized"] is True
          assert data["broad_estimand_changed"] is False
          assert data["method_selected"] is False
          assert data["power_validated"] is False
          assert all(value is False for value in data["boundary"].values())

          print(
              "S4_M2_PREFIX_BRIDGE="
              + json.dumps(
                  {
                      "imported_scientific_run_count": data[
                          "imported_scientific_run_count"
                      ],
                      "imported_method_row_count": data[
                          "imported_method_row_count"
                      ],
                      "terminal_status_counts": data[
                          "terminal_status_counts"
                      ],
                      "new_scientific_run_count": data[
                          "new_scientific_run_count"
                      ],
                      "new_method_execution_count": data[
                          "new_method_execution_count"
                      ],
                      "imported_scientific_run_ids_sha256": data[
                          "imported_scientific_run_ids_sha256"
                      ],
                      "imported_method_row_ids_sha256": data[
                          "imported_method_row_ids_sha256"
                      ],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Upload prefix bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: f1b-r2-s4-m2-prefix-bridge
          path: /tmp/f1b-r2-s4-m2-prefix-bridge.json
          if-no-files-found: error
