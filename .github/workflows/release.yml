name: Publish alpha release
on:
  workflow_run:
    workflows: ['Verify model and web']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read verified version
        id: version
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          from cognitive_epistemic_model import __version__
          assert re.fullmatch(r'\d+\.\d+\.\d+a\d+', __version__)
          tag = 'v' + __version__
          assert Path('releases', tag + '.md').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tag=' + tag + '\nversion=' + __version__ + '\n')
          PY
      - name: Check existing release
        id: existing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag:process.env.TAG});
              if (data.draft && data.target_commitish !== process.env.VERIFIED_SHA) throw new Error('Draft belongs to another commit');
              core.setOutput('status', data.draft ? 'draft' : 'published');
            } catch(e) {
              if (e.status !== 404) throw e;
              core.setOutput('status', 'missing');
            }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.existing.outputs.status != 'published'
        with:
          name: cognitive-epistemic-model-web
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Package verified web build and reproducibility manifest
        if: steps.existing.outputs.status != 'published'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export NODE_VERSION="$(node --version)"
          export PYTHON_VERSION="$(python --version 2>&1)"
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          assets = Path('release-assets')
          assets.mkdir()
          name = 'cognitive-epistemic-model-' + os.environ['TAG'] + '-web.zip'
          archive = assets / name
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('dist').rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to('dist'))

          snapshot = json.loads(Path('model/evidence_snapshot.json').read_text())
          manifest = {
              'software_version': os.environ['VERSION'],
              'model_specification': 'M0',
              'evidence_snapshot': snapshot['id'],
              'verified_commit_sha': os.environ['VERIFIED_SHA'],
              'python_version': os.environ['PYTHON_VERSION'],
              'node_version': os.environ['NODE_VERSION'],
              'package_lock_sha256': hashlib.sha256(Path('web/package-lock.json').read_bytes()).hexdigest(),
              'references_sha256': hashlib.sha256(Path('model/references.json').read_bytes()).hexdigest(),
              'validation_tests_sha256': hashlib.sha256(Path('model/validation_tests.json').read_bytes()).hexdigest(),
              'root_seed': 7,
              'reference_run_purpose': 'MECHANISM_TEST_DEMONSTRATION',
              'boundary': 'Build provenance and reproducibility metadata; not empirical validation.'
          }
          manifest_path = assets / 'reproducibility-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          checksum_lines = []
          for p in (archive, manifest_path):
              checksum_lines.append(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name)
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + '\n')
          PY
      - name: Attest release artifacts
        if: steps.existing.outputs.status != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/reproducibility-manifest.json
            release-assets/SHA256SUMS.txt
      - name: Create draft and attach verified files
        if: steps.existing.outputs.status != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_STATUS: ${{ steps.existing.outputs.status }}
        run: |
          if [ "$RELEASE_STATUS" = missing ]; then
            gh release create "$TAG" --target "$VERIFIED_SHA" --title "Alpha $VERSION" --notes-file "releases/$TAG.md" --draft --prerelease
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --prerelease
