name: M1.E4 authoritative participant-aware screening

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-i-authoritative-participant-screening

permissions:
  contents: read

concurrency:
  group: m1-e4-authoritative-participant-screening
  cancel-in-progress: true

jobs:
  screen:
    name: screen-${{ matrix.allocation }}-${{ matrix.heterogeneity }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        allocation:
          - P40_X16
          - P64_X10
          - P80_X8
          - P128_X5
        heterogeneity:
          - low
          - moderate
          - high

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install .

      - name: Create deterministic shard config
        env:
          ALLOCATION: ${{ matrix.allocation }}
          HETEROGENEITY: ${{ matrix.heterogeneity }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("model/benchmarks/m1_e4_participant_aware_screening.json")
          config = json.loads(source.read_text())

          allocation = os.environ["ALLOCATION"]
          heterogeneity = os.environ["HETEROGENEITY"]

          matches_a = [
              x for x in config["participant_allocations"]
              if x["label"] == allocation
          ]
          matches_h = [
              x for x in config["heterogeneity_regimes"]
              if x["label"] == heterogeneity
          ]
          assert len(matches_a) == 1
          assert len(matches_h) == 1

          # Scientific settings remain frozen. Sharding only subsets the
          # allocation × heterogeneity execution grid.
          config["participant_allocations"] = matches_a
          config["heterogeneity_regimes"] = matches_h
          config["benchmark_id"] = (
              f'{config["benchmark_id"]}.{allocation}.{heterogeneity}'
          )

          out = Path("artifacts/shard_config.json")
          out.write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")

          assert config["seed"] == 20260916
          assert config["replicates"] == 50
          assert config["confirmation_replicates"] == 200
          assert config["quadrature_nodes"] == 5
          assert config["aggregate_target_per_cell"] == 640
          assert config["aggregate_foil_per_cell"] == 640
          assert len(config["bias_grids"]["EVSD"]) == 5
          assert len(config["bias_grids"]["2HT"]) == 5
          assert len(config["memory_grids"]["EVSD"]) == 3
          assert len(config["memory_grids"]["2HT"]) == 3
          PY

      - name: Run authoritative 50-replicate screening shard
        run: |
          python scripts/run_m1_e4_participant_recovery.py \
            --config artifacts/shard_config.json \
            --output artifacts/result.json

      - name: Audit and print complete shard result
        env:
          ALLOCATION: ${{ matrix.allocation }}
          HETEROGENEITY: ${{ matrix.heterogeneity }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("artifacts/result.json").read_text())

          assert result["seed"] == 20260916
          assert result["replicates_per_grid_cell"] == 50
          assert result["quadrature_nodes"] == 5
          assert result["aggregate_target_per_cell"] == 640
          assert result["aggregate_foil_per_cell"] == 640
          assert len(result["grid_results"]) == 6

          for row in result["grid_results"]:
              assert row["allocation"] == os.environ["ALLOCATION"]
              assert row["heterogeneity"] == os.environ["HETEROGENEITY"]
              assert row["replicates"] == 50

          print("allocation:", os.environ["ALLOCATION"])
          print("heterogeneity:", os.environ["HETEROGENEITY"])
          print(
              "minimum_recovery:",
              min(row["recovery_probability"] for row in result["grid_results"]),
          )
          print(
              "pass_cells:",
              sum(row["passes_recovery_threshold"] for row in result["grid_results"]),
              "/ 6",
          )
          print(
              "wrong_total:",
              sum(row["selected"][
                  "2HT" if row["generator"] == "EVSD" else "EVSD"
              ] for row in result["grid_results"]),
          )
          print(
              "inconclusive_total:",
              sum(row["selected"]["INCONCLUSIVE"] for row in result["grid_results"]),
          )
          print("SCREEN_RESULT_JSON::" + json.dumps(result, sort_keys=True))
          PY

      - name: Create SHA-256 checksums
        run: |
          sha256sum artifacts/shard_config.json artifacts/result.json \
            > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: participant-screen-${{ matrix.allocation }}-${{ matrix.heterogeneity }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
