name: M1.E4 authoritative participant-aware screening

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-i-participant-screening-run

permissions:
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        allocation: [P40_X16, P64_X10, P80_X8, P128_X5]
        heterogeneity: [low, moderate, high]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install .
      - name: Build shard config
        env:
          ALLOCATION: ${{ matrix.allocation }}
          HETEROGENEITY: ${{ matrix.heterogeneity }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          src = Path("model/benchmarks/m1_e4_participant_aware_screening.json")
          config = json.loads(src.read_text())
          config["benchmark_id"] = (
              config["benchmark_id"]
              + f".{os.environ['ALLOCATION']}.{os.environ['HETEROGENEITY']}"
          )
          config["participant_allocations"] = [
              x for x in config["participant_allocations"]
              if x["label"] == os.environ["ALLOCATION"]
          ]
          config["heterogeneity_regimes"] = [
              x for x in config["heterogeneity_regimes"]
              if x["label"] == os.environ["HETEROGENEITY"]
          ]
          assert len(config["participant_allocations"]) == 1
          assert len(config["heterogeneity_regimes"]) == 1
          Path("artifacts/shard_config.json").write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Run 50-replicate participant-aware shard
        run: |
          python scripts/run_m1_e4_participant_recovery.py \
            --config artifacts/shard_config.json \
            --output artifacts/result.json
      - name: Audit shard
        env:
          ALLOCATION: ${{ matrix.allocation }}
          HETEROGENEITY: ${{ matrix.heterogeneity }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("artifacts/result.json").read_text())
          assert d["seed"] == 20260916
          assert d["replicates_per_grid_cell"] == 50
          assert d["aggregate_target_per_cell"] == 640
          assert d["aggregate_foil_per_cell"] == 640
          assert len(d["grid_results"]) == 6
          for row in d["grid_results"]:
              assert row["allocation"] == os.environ["ALLOCATION"]
              assert row["heterogeneity"] == os.environ["HETEROGENEITY"]
          print("allocation:", os.environ["ALLOCATION"])
          print("heterogeneity:", os.environ["HETEROGENEITY"])
          print("minimum_recovery:", d["minimum_grid_recovery_probability"])
          print("all_pass:", d["all_grid_cells_pass"])
          for row in d["grid_results"]:
              print(json.dumps(row, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screen-${{ matrix.allocation }}-${{ matrix.heterogeneity }}
          path: artifacts/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: screen-*
          path: shards
          merge-multiple: false
      - name: Aggregate authoritative screening
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("shards").glob("*/result.json"))
          assert len(files) == 12, len(files)

          combined_rows = []
          aggregate = {
              "EVSD": {"EVSD": 0, "2HT": 0, "INCONCLUSIVE": 0},
              "2HT": {"EVSD": 0, "2HT": 0, "INCONCLUSIVE": 0},
          }

          for path in files:
              d = json.loads(path.read_text())
              combined_rows.extend(d["grid_results"])
              for generator in aggregate:
                  for selected in aggregate[generator]:
                      aggregate[generator][selected] += d["confusion_counts"][generator][selected]

          assert len(combined_rows) == 72
          probabilities = {}
          for generator, counts in aggregate.items():
              total = sum(counts.values())
              probabilities[generator] = {
                  selected: count / total for selected, count in counts.items()
              }

          result = {
              "benchmark_id": "BENCH.M1.E4.PARTICIPANT_AWARE.SCREENING.2026-09-16",
              "seed": 20260916,
              "replicates_per_grid_cell": 50,
              "grid_cells": 72,
              "aggregate_target_per_cell": 640,
              "aggregate_foil_per_cell": 640,
              "confusion_counts": aggregate,
              "confusion_probability": probabilities,
              "grid_results": combined_rows,
              "minimum_grid_recovery_probability": min(
                  row["recovery_probability"] for row in combined_rows
              ),
              "all_grid_cells_pass": all(
                  row["passes_recovery_threshold"] for row in combined_rows
              ),
          }

          Path("artifacts/m1_e4_participant_screening_authoritative.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )

          print("minimum_grid_recovery_probability:", result["minimum_grid_recovery_probability"])
          print("all_grid_cells_pass:", result["all_grid_cells_pass"])
          print("confusion_probability:")
          print(json.dumps(probabilities, indent=2, sort_keys=True))

          # Allocation × heterogeneity summaries.
          for allocation in ("P40_X16","P64_X10","P80_X8","P128_X5"):
              for hetero in ("low","moderate","high"):
                  rows = [
                      r for r in combined_rows
                      if r["allocation"] == allocation and r["heterogeneity"] == hetero
                  ]
                  assert len(rows) == 6
                  print(
                      "SUMMARY",
                      allocation,
                      hetero,
                      "min",
                      min(r["recovery_probability"] for r in rows),
                      "pass",
                      sum(r["passes_recovery_threshold"] for r in rows),
                      "/6",
                      "mean",
                      sum(r["recovery_probability"] for r in rows) / 6,
                  )

          failed = [r for r in combined_rows if not r["passes_recovery_threshold"]]
          print("failed_cells:", len(failed))
          for row in failed:
              print("FAILED", json.dumps(row, sort_keys=True))
          PY
      - name: Create SHA-256 checksum
        run: |
          sha256sum artifacts/m1_e4_participant_screening_authoritative.json \
            > artifacts/m1_e4_participant_screening_authoritative.sha256
          cat artifacts/m1_e4_participant_screening_authoritative.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-e4-participant-screening-authoritative
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
