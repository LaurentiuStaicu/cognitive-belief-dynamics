name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen build and scientific-test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt build pytest hypothesis hatchling

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install "pip==26.2.1"
          /tmp/cbd-clean/bin/python -m pip install -c "$CBD_CI_CONSTRAINTS" dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c 'import cognitive_epistemic_model as cbd; from importlib.metadata import metadata; m = metadata("cognitive-belief-dynamics"); assert cbd.__version__ == "0.1.1"; assert m["License-Expression"] == "MIT AND CC-BY-4.0"; assert set(m.get_all("License-File") or []) == {"LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSING.md"}'
          )

      - name: Install built wheel for repository tests
        run: python -m pip install -c requirements/ci-py312-linux.lock.txt dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Verify retained authoritative F1a recovery result
        if: ${{ hashFiles('model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json') != '' }}
        run: |
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json"))["provenance"]["source_commit"])')"
          python scripts/run_f1a_transmission_recovery.py \
            --output /tmp/f1a-transmission-recovery.json \
            --source-commit "$SOURCE_COMMIT"
          diff -u \
            model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json \
            /tmp/f1a-transmission-recovery.json

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo


  recover_f1b_r2_continuation_c1:
    name: Resampling continuation C1 combine recovery
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt
      SCIENTIFIC_SOURCE_COMMIT: "ff63e6f72af54b78070a0d74c514805401602943"
      SOURCE_RUN_ID: "36345806090"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen execution environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt .

      - name: Download immutable C1 shards from failed-closed source run
        uses: actions/download-artifact@v4
        with:
          pattern: f1b-r2-continuation-c1-*
          path: /tmp/parts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36345806090

      - name: Verify eight source C1 shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              Path("/tmp/parts").glob("f1b-r2-continuation-c1-*.json")
          )
          assert len(paths) == 8, [str(path) for path in paths]
          seen = set()
          total = 0
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              shard = int(data["shard_index"])
              seen.add(shard)
              total += int(data["qualified_run_count"])
              assert data["stage"] == "C1"
              assert data["authoritative"] is False
              assert data["provenance"]["source_commit"] == (
                  "ff63e6f72af54b78070a0d74c514805401602943"
              )
          assert seen == set(range(8))
          assert total == 224
          PY

      - name: Combine failed-closed C1 diagnostic
        run: |
          python scripts/combine_f1b_r2_resampling_risk_continuation_qualification.py \
            --partition /tmp/parts/f1b-r2-continuation-c1-0.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-1.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-2.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-3.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-4.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-5.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-6.json \
            --partition /tmp/parts/f1b-r2-continuation-c1-7.json \
            --output /tmp/f1b-r2-continuation-c1-combined-failed.json
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("/tmp/f1b-r2-continuation-c1-combined-failed.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["qualified_run_count"] == 224
          assert data["gate_pass"] is False
          assert data["next_gate"] == (
              "BLOCKED_BY_STAGE_C1_REPRODUCTION_FAILURE"
          )
          patterns = Counter(
              (
                  row["dataset_fingerprint_match"],
                  row["observed_statistic_match"],
                  row["attempt_sequence_sha256_match"],
              )
              for row in data["rows"]
          )
          deltas = [
              float(row["observed_statistic_absolute_delta"])
              for row in data["rows"]
          ]
          summary = {
              "qualified_run_count": data["qualified_run_count"],
              "qualification_pass_count": data["qualification_pass_count"],
              "qualification_failure_count": data[
                  "qualification_failure_count"
              ],
              "gate_pass": data["gate_pass"],
              "pattern_counts": {
                  str(key): value for key, value in sorted(patterns.items())
              },
              "max_observed_statistic_absolute_delta": max(deltas),
              "exact_json_sha256": hashlib.sha256(
                  path.read_bytes()
              ).hexdigest(),
              "exact_json_size_bytes": path.stat().st_size,
          }
          print("F1B_R2_C1_RECOVERY_SUMMARY_BEGIN")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("F1B_R2_C1_RECOVERY_SUMMARY_END")
          PY

      - name: Upload exact combined failed-closed C1 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: f1b-r2-continuation-c1-combined-failed
          path: /tmp/f1b-r2-continuation-c1-combined-failed.json
          if-no-files-found: error
