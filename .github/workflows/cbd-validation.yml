name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen build and scientific-test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt build pytest hypothesis hatchling

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install "pip==26.2.1"
          /tmp/cbd-clean/bin/python -m pip install -c "$CBD_CI_CONSTRAINTS" dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c 'import cognitive_epistemic_model as cbd; from importlib.metadata import metadata; m = metadata("cognitive-belief-dynamics"); assert cbd.__version__ == "0.1.1"; assert m["License-Expression"] == "MIT AND CC-BY-4.0"; assert set(m.get_all("License-File") or []) == {"LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSING.md"}'
          )

      - name: Install built wheel for repository tests
        run: python -m pip install -c requirements/ci-py312-linux.lock.txt dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Verify retained authoritative F1a recovery result
        if: ${{ hashFiles('model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json') != '' }}
        run: |
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json"))["provenance"]["source_commit"])')"
          python scripts/run_f1a_transmission_recovery.py \
            --output /tmp/f1a-transmission-recovery.json \
            --source-commit "$SOURCE_COMMIT"
          diff -u \
            model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json \
            /tmp/f1a-transmission-recovery.json

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo


  execute_f1b_r2_kl_minus_drift_context:
    name: KL minus drift context (${{ matrix.ray_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ray_id: A1_MINUS
            anchor: CBD_ANCHOR_1
          - ray_id: A2_MINUS
            anchor: CBD_ANCHOR_2
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt
      SCIENTIFIC_SOURCE_COMMIT: "bf4e0184da867f1b2df4f27e8d9eaaa7d7871c7d"
      RAY_ID: ${{ matrix.ray_id }}
      KL_ANCHOR: ${{ matrix.anchor }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen execution environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt .

      - name: Execute unchanged minus envelope until frozen guard
        run: |
          python scripts/run_f1b_r2_kl_complement_envelope.py \
            --anchor "$KL_ANCHOR" \
            --sign -1 \
            --output "/tmp/f1b-r2-kl-minus-${RAY_ID}.json" \
            --source-commit "$SCIENTIFIC_SOURCE_COMMIT"

      - name: Upload result only if complete
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f1b-r2-kl-minus-${{ matrix.ray_id }}
          path: /tmp/f1b-r2-kl-minus-${{ matrix.ray_id }}.json
          if-no-files-found: error
