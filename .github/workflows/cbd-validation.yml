name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen build and scientific-test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt build pytest hypothesis hatchling

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install "pip==26.2.1"
          /tmp/cbd-clean/bin/python -m pip install -c "$CBD_CI_CONSTRAINTS" dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c 'import cognitive_epistemic_model as cbd; from importlib.metadata import metadata; m = metadata("cognitive-belief-dynamics"); assert cbd.__version__ == "0.1.1"; assert m["License-Expression"] == "MIT AND CC-BY-4.0"; assert set(m.get_all("License-File") or []) == {"LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSING.md"}'
          )

      - name: Install built wheel for repository tests
        run: python -m pip install -c requirements/ci-py312-linux.lock.txt dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Verify retained authoritative F1a recovery result
        if: ${{ hashFiles('model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json') != '' }}
        run: |
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json"))["provenance"]["source_commit"])')"
          python scripts/run_f1a_transmission_recovery.py \
            --output /tmp/f1a-transmission-recovery.json \
            --source-commit "$SOURCE_COMMIT"
          diff -u \
            model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json \
            /tmp/f1a-transmission-recovery.json

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo


  execute_f1b_r2_closure_regression:
    name: F1b R2 closure regression
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt
      SCIENTIFIC_SOURCE_COMMIT: "a59f65eba5bfe0cdf5cb51f1316c9798e8663902"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen execution environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt .

      - name: Execute corrected #171 closure review
        run: |
          python scripts/run_f1b_r2_distance_definition_review.py             --output /tmp/f1b-r2-distance-definition-closure-review-corrected.json             --source-commit "$SCIENTIFIC_SOURCE_COMMIT"
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("/tmp/f1b-r2-distance-definition-closure-review-corrected.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          case_results = data["case_results"]
          rows = []
          for case in case_results:
              for candidate in case["candidate_results"]:
                  closure = candidate["closure_attainment_diagnostic"]
                  widest = closure["selected_widest_domain"]
                  rows.append({
                      "case_id": case["case_id"],
                      "candidate_id": candidate["candidate_id"],
                      "attainment_status": closure["attainment_status"],
                      "closure_boundary_components": closure["closure_boundary_components"],
                      "scientific_domain_components": closure["scientific_domain_components"],
                      "objective": widest["objective"],
                      "primary_distance": widest["primary_distance"],
                      "surface_coordinates": widest["selected_surface_coordinates"],
                      "selected_start_source": widest.get("selected_start_source"),
                      "nested_continuation": widest.get("nested_continuation"),
                  })

          print("F1B_R2_CLOSURE_REGRESSION_SUMMARY_BEGIN")
          print(json.dumps({
              "case_count": len(case_results),
              "candidate_rows": len(rows),
              "attainment_counts": [
                  {
                      "candidate_id": candidate_id,
                      "attainment_status": status,
                      "count": count,
                  }
                  for (candidate_id, status), count in sorted(Counter(
                      (row["candidate_id"], row["attainment_status"])
                      for row in rows
                  ).items())
              ],
              "unresolved": [
                  row for row in rows
                  if row["attainment_status"] == "SCIENTIFIC_DOMAIN_UNRESOLVED"
              ],
              "rows": rows,
              "provenance": data["provenance"],
          }, sort_keys=True, separators=(",", ":")))
          print("F1B_R2_CLOSURE_REGRESSION_SUMMARY_END")
          PY

      - name: Upload corrected exact closure review
        uses: actions/upload-artifact@v4
        with:
          name: f1b-r2-distance-definition-closure-review-corrected
          path: /tmp/f1b-r2-distance-definition-closure-review-corrected.json
          if-no-files-found: error
