name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen build and scientific-test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt build pytest hypothesis hatchling

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install "pip==26.2.1"
          /tmp/cbd-clean/bin/python -m pip install -c "$CBD_CI_CONSTRAINTS" dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c 'import cognitive_epistemic_model as cbd; from importlib.metadata import metadata; m = metadata("cognitive-belief-dynamics"); assert cbd.__version__ == "0.1.1"; assert m["License-Expression"] == "MIT AND CC-BY-4.0"; assert set(m.get_all("License-File") or []) == {"LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSING.md"}'
          )

      - name: Install built wheel for repository tests
        run: python -m pip install -c requirements/ci-py312-linux.lock.txt dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Verify retained authoritative F1a recovery result
        if: ${{ hashFiles('model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json') != '' }}
        run: |
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json"))["provenance"]["source_commit"])')"
          python scripts/run_f1a_transmission_recovery.py \
            --output /tmp/f1a-transmission-recovery.json \
            --source-commit "$SOURCE_COMMIT"
          diff -u \
            model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json \
            /tmp/f1a-transmission-recovery.json

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo


  execute_f1b_r2_resampling_risk_replay:
    name: F1b R2 retained resampling-risk replay
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt
      SCIENTIFIC_SOURCE_COMMIT: "4d3418938e11984f4f94ca2ae83d609fc9648d9a"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen execution environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt .

      - name: Download exact retained paired artifact
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-kl-v2-paired-combined-recovered
          path: /tmp/retained
          github-token: ${{ github.token }}
          repository: LaurentiuStaicu/cognitive-belief-dynamics
          run-id: 36340881516

      - name: Replay frozen resampling-risk controller
        run: |
          python scripts/run_f1b_r2_resampling_risk_replay.py \
            --input /tmp/retained/f1b-r2-kl-v2-paired-combined.json \
            --output /tmp/f1b-r2-resampling-risk-replay.json \
            --source-commit "$SCIENTIFIC_SOURCE_COMMIT"
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/f1b-r2-resampling-risk-replay.json").read_text(
                  encoding="utf-8"
              )
          )
          assert data["authoritative"] is False
          assert data["restriction_run_count"] == 750
          assert data["bootstrap_refit_failure_count"] == 0
          assert data["provenance"]["input_sha256"] == (
              "b2727462b5bd09e5570090a42d7c90da8866e02100e0f4ccad551d8958a3d301"
          )
          assert data["provenance"]["retained_artifact_id"] == 10938668225

          summary = data["global_summary"]
          role = {
              row["role"]: row for row in data["by_role"]
          }
          target = {
              row["target_mean_bernoulli_kl"]: row
              for row in data["by_target"]
          }

          print("F1B_R2_RESAMPLING_RISK_REPLAY_SUMMARY_BEGIN")
          print(json.dumps({
              "global_summary": summary,
              "by_role": role,
              "by_target": target,
              "controller": {
                  "alpha": data["alpha"],
                  "epsilon": data["epsilon"],
                  "halfspend": data["halfspend"],
                  "max_attempts": data["max_attempts"],
              },
              "provenance": data["provenance"],
          }, sort_keys=True, separators=(",", ":")))
          print("F1B_R2_RESAMPLING_RISK_REPLAY_SUMMARY_END")
          PY

      - name: Upload exact replay result
        uses: actions/upload-artifact@v4
        with:
          name: f1b-r2-resampling-risk-replay-v1
          path: /tmp/f1b-r2-resampling-risk-replay.json
          if-no-files-found: error
