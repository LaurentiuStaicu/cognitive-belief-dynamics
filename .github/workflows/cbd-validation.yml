name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and scientific-test tools
        run: python -m pip install --upgrade pip build "pytest>=8" "hypothesis>=6" "hatchling==1.32.4"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install --upgrade pip
          /tmp/cbd-clean/bin/python -m pip install dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c "import cognitive_epistemic_model as cbd; assert cbd.__version__ == '0.1.0'"
          )

      - name: Install built wheel for repository tests
        run: python -m pip install dist/*.whl

      - name: Emit resolved CI environment for Repair C lock capture
        run: python -m pip freeze | sort

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo
