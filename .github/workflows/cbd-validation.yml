name: CBD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test CBD
    runs-on: ubuntu-latest
    env:
      CBD_CI_CONSTRAINTS: ${{ github.workspace }}/requirements/ci-py312-linux.lock.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen build and scientific-test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/ci-py312-linux.lock.txt build pytest hypothesis hatchling

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify clean wheel installation and package version
        run: |
          python -m venv /tmp/cbd-clean
          /tmp/cbd-clean/bin/python -m pip install "pip==26.2.1"
          /tmp/cbd-clean/bin/python -m pip install -c "$CBD_CI_CONSTRAINTS" dist/*.whl
          (
            cd /tmp
            /tmp/cbd-clean/bin/python -c 'import cognitive_epistemic_model as cbd; from importlib.metadata import metadata; m = metadata("cognitive-belief-dynamics"); assert cbd.__version__ == "0.1.1"; assert m["License-Expression"] == "MIT AND CC-BY-4.0"; assert set(m.get_all("License-File") or []) == {"LICENSE", "LICENSES/CC-BY-4.0.txt", "LICENSING.md"}'
          )

      - name: Install built wheel for repository tests
        run: python -m pip install -c requirements/ci-py312-linux.lock.txt dist/*.whl

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run retained CBD scientific verification harness
        run: python -m pytest

      - name: Verify retained authoritative F1a recovery result
        if: ${{ hashFiles('model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json') != '' }}
        run: |
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json"))["provenance"]["source_commit"])')"
          python scripts/run_f1a_transmission_recovery.py \
            --output /tmp/f1a-transmission-recovery.json \
            --source-commit "$SOURCE_COMMIT"
          diff -u \
            model/benchmarks/results/f1a_transmission_recovery_authoritative_2026-09-21.json \
            /tmp/f1a-transmission-recovery.json

      - name: Validate canonical registries from checkout
        run: cemodel validate --root .

      - name: Verify installed package resources outside checkout
        working-directory: /tmp
        run: |
          cemodel validate
          cemodel demo


  retain_f1b_r2_resampling_risk_replay_result:
    name: TEMP retain F1b R2 risk replay result
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check whether compact result is already retained
        id: retained
        run: |
          if [ -f model/results/f1b_r2_resampling_risk_replay_2026-09-27.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact Stage-B replay artifact
        if: steps.retained.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: f1b-r2-resampling-risk-replay-v1
          path: /tmp/replay
          github-token: ${{ github.token }}
          repository: LaurentiuStaicu/cognitive-belief-dynamics
          run-id: 36343709630

      - name: Build compact retained result
        if: steps.retained.outputs.exists != 'true'
        run: |
          python scripts/build_f1b_r2_resampling_risk_replay_retention.py \
            --input /tmp/replay/f1b-r2-resampling-risk-replay.json \
            --output model/results/f1b_r2_resampling_risk_replay_2026-09-27.json \
            --artifact-id 10938984164 \
            --artifact-zip-sha256 0a7f6308aa0bd21866a4559d4dec38210b2225fa3f23f3e45da4abcbba76574b
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "model/results/"
              "f1b_r2_resampling_risk_replay_2026-09-27.json"
          )
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["authoritative"] is False
          assert data["issue"] == 213
          assert data["global_summary"]["run_count"] == 750
          assert data["global_summary"]["resolved_by_199_count"] == 526
          assert data["global_summary"]["unresolved_at_199_count"] == 224
          assert len(data["stream_checkpoints"]) == 750
          assert len(data["unresolved_run_ids"]) == 224
          assert data["integrity"][
              "sequential_vs_fixed_199_disagreement_count_among_resolved"
          ] == 0
          print("compact_bytes", p.stat().st_size)
          PY

      - name: Commit compact retained result
        if: steps.retained.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/results/f1b_r2_resampling_risk_replay_2026-09-27.json
          git commit -m "F1b R2: materialize resampling-risk replay checkpoint"
          git push origin "HEAD:${{ github.head_ref }}"
