name: M1.E4 authoritative candidate recovery

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-f-authoritative-recovery-run

permissions:
  contents: read

jobs:
  authoritative-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install .
      - name: Run frozen 200-replicate-per-cell benchmark
        run: |
          mkdir -p artifacts
          python scripts/run_m1_e4_candidate_recovery.py \
            --config model/benchmarks/m1_e4_candidate_recovery_core.json \
            --output artifacts/m1_e4_candidate_recovery_authoritative.json
      - name: Audit benchmark result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/m1_e4_candidate_recovery_authoritative.json")
          d = json.loads(p.read_text())

          print("benchmark_id:", d["benchmark_id"])
          print("seed:", d["seed"])
          print("replicates_per_grid_cell:", d["replicates_per_grid_cell"])
          print("selection_rule:", d["selection_rule"])
          print("minimum_grid_recovery_probability:", d["minimum_grid_recovery_probability"])
          print("all_core_grid_cells_pass:", d["all_core_grid_cells_pass"])
          print("confusion_probability:")
          print(json.dumps(d["confusion_probability"], indent=2, sort_keys=True))

          failed = [
              row for row in d["grid_results"]
              if not row["passes_recovery_threshold"]
          ]
          print("failed_grid_cells:", len(failed))
          for row in failed:
              print(json.dumps(row, sort_keys=True))

          assert d["replicates_per_grid_cell"] == 200
          assert d["seed"] == 20260916
          assert len(d["grid_results"]) == 24
          PY
      - name: Create SHA-256 checksum
        run: |
          sha256sum artifacts/m1_e4_candidate_recovery_authoritative.json \
            > artifacts/m1_e4_candidate_recovery_authoritative.sha256
          cat artifacts/m1_e4_candidate_recovery_authoritative.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-e4-authoritative-candidate-recovery
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
