name: MOD14 final product architecture pass
on:
  push:
    branches: [mod14-world-model-construction]
permissions:
  contents: write
jobs:
  product-architecture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply product architecture integration
        run: python .github/scripts/product_architecture_pass.py
      - name: Validate Python model and contracts
        run: |
          python -m pip install '.[test]'
          python -m pytest
      - name: Validate full web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Validate browser product contract and accessibility
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Remove one-shot integration helpers
        if: success()
        run: |
          rm -f .github/scripts/product_architecture_pass.py
          rm -f .github/workflows/product-architecture-pass.yml
      - name: Commit validated product architecture pass
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MOD14: make CEM complexity explorable in InfoClar'
          git push
