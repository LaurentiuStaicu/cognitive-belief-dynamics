name: M1.E4 Phase J optimizer failure diagnostic

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-j-authoritative-confirmation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install .

      - name: Reproduce and isolate deterministic pooled 2HT initialization failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np

          from cognitive_epistemic_model.calibration.m1_e4_candidate_recovery import (
              RecoveryFamily,
              fit_candidate,
          )
          from cognitive_epistemic_model.calibration.m1_e4_participant_confirmation import (
              _lookup_cell_inputs,
              cell_seed,
          )
          from cognitive_epistemic_model.calibration.m1_e4_participant_recovery import (
              _aggregate_for_initialization,
              simulate_participant_dataset,
          )

          confirmation = json.loads(
              Path("model/benchmarks/m1_e4_participant_confirmation_200.json").read_text()
          )
          screening = json.loads(
              Path(confirmation["source_screening_config"]).read_text()
          )
          cell_id = "P128_X5__high__2HT__strong"
          selected = [x for x in confirmation["selected_cells"] if x["cell_id"] == cell_id]
          assert len(selected) == 1
          selected = selected[0]

          allocation, heterogeneity, truth, biases = _lookup_cell_inputs(
              screening, selected
          )
          rng = np.random.default_rng(cell_seed(confirmation["base_seed"], cell_id))

          for replicate_index in range(1, confirmation["replicates_per_cell"] + 1):
              train = simulate_participant_dataset(
                  family=RecoveryFamily.TWO_HT,
                  population_memory=truth,
                  population_biases=biases,
                  participants=int(allocation["participants"]),
                  n_target_per_cell=int(allocation["target_trials_per_participant_per_cell"]),
                  n_foil_per_cell=int(allocation["foil_trials_per_participant_per_cell"]),
                  sigma_memory=float(heterogeneity["sigma_memory"]),
                  sigma_bias=float(heterogeneity["sigma_bias"]),
                  rng=rng,
              )
              # Advance the RNG exactly as the authoritative runner does before fitting.
              _held_out = simulate_participant_dataset(
                  family=RecoveryFamily.TWO_HT,
                  population_memory=truth,
                  population_biases=biases,
                  participants=int(allocation["participants"]),
                  n_target_per_cell=int(allocation["target_trials_per_participant_per_cell"]),
                  n_foil_per_cell=int(allocation["foil_trials_per_participant_per_cell"]),
                  sigma_memory=float(heterogeneity["sigma_memory"]),
                  sigma_bias=float(heterogeneity["sigma_bias"]),
                  rng=rng,
              )

              pooled = _aggregate_for_initialization(train)
              try:
                  fit_candidate(RecoveryFamily.TWO_HT, pooled)
              except RuntimeError as exc:
                  serial = {
                      condition: [
                          {
                              "n_target": p.n_target,
                              "n_foil": p.n_foil,
                              "n_hit": p.n_hit,
                              "n_fa": p.n_fa,
                          }
                          for p in points
                      ]
                      for condition, points in pooled.items()
                  }
                  print("FAILURE_REPLICATE_INDEX_1BASED::" + str(replicate_index))
                  print("FAILURE_EXCEPTION::" + repr(exc))
                  print("FAILURE_POOLED_COUNTS_JSON::" + json.dumps(serial, sort_keys=True))

                  for condition, points in pooled.items():
                      try:
                          fit_candidate(
                              RecoveryFamily.TWO_HT,
                              {condition: points},
                          )
                      except RuntimeError as condition_exc:
                          print(
                              "FAILURE_CONDITION::"
                              + condition
                              + "::"
                              + repr(condition_exc)
                          )
                  raise SystemExit(0)

          raise SystemExit("expected deterministic failure was not reproduced")
          PY
