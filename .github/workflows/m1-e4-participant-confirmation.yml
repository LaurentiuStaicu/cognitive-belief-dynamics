name: M1.E4 Phase J L-BFGS-B retry diagnostic

on:
  push:
    branches:
      - alpha-0.4.3a0-phase-j-authoritative-confirmation

permissions:
  contents: read

jobs:
  diagnose-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install .
      - name: Compare default and expanded line-search budget on exact failing counts
        run: |
          python - <<'PY'
          import numpy as np
          from scipy.optimize import minimize

          from cognitive_epistemic_model.calibration.m1_e4_candidate_recovery import (
              RecognitionCounts,
              _corrected_rates,
              _point_log_likelihood,
              two_ht_probabilities,
          )

          points = (
              RecognitionCounts(640, 640, 467, 37),
              RecognitionCounts(640, 640, 494, 69),
              RecognitionCounts(640, 640, 534, 106),
              RecognitionCounts(640, 640, 571, 143),
              RecognitionCounts(640, 640, 605, 165),
          )

          hit, fa = _corrected_rates(points)
          ddet0 = float(np.clip(np.median(hit - fa), 0.02, 0.95))
          g0 = np.clip(fa / max(1.0 - ddet0, 1e-6), 0.02, 0.98)
          x0 = np.concatenate(([ddet0], g0))
          bounds = [(1e-6, 1.0 - 1e-6)] * len(x0)

          def objective(x):
              ddet = float(x[0])
              total = 0.0
              for guess, counts in zip(x[1:], points, strict=True):
                  h, ff = two_ht_probabilities(ddet, float(guess))
                  total += _point_log_likelihood(counts, h, ff)
              return -total

          default = minimize(
              objective, x0=x0, method="L-BFGS-B", bounds=bounds
          )
          retry_100 = minimize(
              objective, x0=x0, method="L-BFGS-B", bounds=bounds,
              options={"maxls": 100},
          )
          retry_200 = minimize(
              objective, x0=x0, method="L-BFGS-B", bounds=bounds,
              options={"maxls": 200},
          )

          for label, result in [
              ("DEFAULT", default),
              ("MAXLS100", retry_100),
              ("MAXLS200", retry_200),
          ]:
              print(label + "_SUCCESS::" + repr(bool(result.success)))
              print(label + "_MESSAGE::" + repr(str(result.message)))
              print(label + "_FUN::" + repr(float(result.fun)))
              print(label + "_X::" + repr([float(x) for x in result.x]))
              print(label + "_NIT::" + repr(int(result.nit)))
              print(label + "_NFEV::" + repr(int(result.nfev)))

          assert default.success is False
          assert retry_100.success is True
          assert retry_200.success is True
          assert np.isclose(retry_100.fun, retry_200.fun, rtol=1e-10, atol=1e-8)
          assert np.allclose(retry_100.x, retry_200.x, rtol=1e-8, atol=1e-8)
          PY
