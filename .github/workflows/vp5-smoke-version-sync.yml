name: VP-5 one-shot smoke version sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-smoke-release-guard:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'visual-polish-vp5-release-consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Align smoke release guard and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o '0\.4\.2a0' web/scripts/smoke.mjs | wc -l)" -eq 1
          sed -i 's/0\.4\.2a0/0.4.3a0/' web/scripts/smoke.mjs
          if grep -R --line-number --fixed-strings '0.4.2a0' web/scripts; then
            echo 'Unexpected stale release literal remains under web/scripts.' >&2
            exit 1
          fi
          rm .github/workflows/vp5-smoke-version-sync.yml
          git add web/scripts/smoke.mjs .github/workflows/vp5-smoke-version-sync.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "VP-5: align browser smoke release guard"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
