name: M1 Phase M authoritative protocol robustness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m1-phase-m-authoritative.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-phase-m-authoritative-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Phase M ${{ matrix.profile }} / ${{ matrix.generator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - REFERENCE
          - ITEM_MODERATE
          - ITEM_HIGH
          - RHO_POSITIVE
          - RHO_NEGATIVE
          - SERIAL_DEGRADATION
          - MAR_LIKE_ATTRITION
          - LATENT_ASSOCIATED_ATTRITION
          - COMBINED_ADVERSE
        generator:
          - EVSD
          - 2HT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install model
        run: python -m pip install .
      - name: Run frozen authoritative cell
        env:
          PROFILE: ${{ matrix.profile }}
          GENERATOR: ${{ matrix.generator }}
        run: |
          mkdir -p results
          python scripts/run_m1_e4_protocol_robustness.py \
            --profile "$PROFILE" \
            --generator "$GENERATOR" \
            --output "results/${PROFILE}-${GENERATOR}.json"
      - name: Verify authoritative cell contract
        env:
          PROFILE: ${{ matrix.profile }}
          GENERATOR: ${{ matrix.generator }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = os.environ['PROFILE']
          generator = os.environ['GENERATOR']
          path = Path(f"results/{profile}-{generator}.json")
          row = json.loads(path.read_text())
          assert row['phase'] == 'M', row['phase']
          assert row['profile_id'] == profile, row['profile_id']
          assert row['generator'] == generator, row['generator']
          assert row['cell_id'] == f'{profile}__{generator}', row['cell_id']
          assert row['replicates'] == 200, row['replicates']
          assert row['benchmark_id'] == 'BENCH.M1.E4.PROTOCOL_ROBUSTNESS.2026-09-17', row['benchmark_id']
          print(f"Validated authoritative cell {row['cell_id']} with {row['replicates']} replicates")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-m-cell-${{ matrix.profile }}-${{ matrix.generator }}
          path: results/${{ matrix.profile }}-${{ matrix.generator }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate frozen Phase M verdict
    if: ${{ always() }}
    needs: [cell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install model
        run: python -m pip install .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phase-m-cell-*
          path: collected
          merge-multiple: true
      - name: Aggregate and validate authoritative matrix
        env:
          CONTRACT_TOOLING_SHA: 2be27f09d054448abb9005ccf29c0017990a4ccc
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cognitive_epistemic_model.calibration.m1_e4_protocol_robustness import (
              summarize_protocol_robustness_results,
          )

          config_path = Path('model/benchmarks/m1_e4_protocol_robustness_200.json')
          config = json.loads(config_path.read_text())
          paths = sorted(Path('collected').glob('*.json'))
          if len(paths) != 18:
              raise SystemExit(f'Authoritative Phase M matrix incomplete: expected 18 result files, found {len(paths)}')

          rows = [json.loads(path.read_text()) for path in paths]
          for row in rows:
              if row.get('replicates') != int(config['replicates_per_cell']):
                  raise SystemExit(f"Non-authoritative replicate count in {row.get('cell_id')}: {row.get('replicates')}")
              if row.get('benchmark_id') != config['benchmark_id']:
                  raise SystemExit(f"Benchmark mismatch in {row.get('cell_id')}: {row.get('benchmark_id')}")

          summary = summarize_protocol_robustness_results(config, rows)
          summary['run_provenance'] = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'executed_commit_sha': os.environ['GITHUB_SHA'],
              'contract_tooling_commit_sha': os.environ['CONTRACT_TOOLING_SHA'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
          }
          Path('phase-m-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'status': summary['status'],
              'selected_cells_total': summary['selected_cells_total'],
              'minimum_recovery_probability': summary['minimum_recovery_probability'],
              'minimum_wilson_lower': summary['minimum_wilson_lower'],
              'formal_failed_cells': summary['formal_failed_cells'],
              'secondary_wilson_failed_cells': summary['secondary_wilson_failed_cells'],
          }, indent=2, sort_keys=True))
          PY
      - name: Generate checksums
        run: |
          sha256sum collected/*.json phase-m-summary.json | sort -k2 > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-phase-m-authoritative-${{ github.run_id }}
          path: |
            collected/*.json
            phase-m-summary.json
            SHA256SUMS.txt
          if-no-files-found: error
