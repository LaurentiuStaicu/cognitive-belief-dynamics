name: Temporary InfoClar language persistence patch

on:
  push:
    branches:
      - uniformize-infoclar-v1-1-shell
    paths:
      - .github/workflows/uniformize-v11-language-persist.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: uniformize-infoclar-v1-1-shell
          fetch-depth: 0
      - name: Persist language preference
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('web/src/main.ts')
          source=path.read_text()
          old="let lang:Lang = 'en';"
          new="const savedLanguage=localStorage.getItem('cem.ui.language');\nlet lang:Lang = savedLanguage==='ro'||savedLanguage==='en'?savedLanguage:'en';"
          assert old in source
          source=source.replace(old,new,1)
          old="document.getElementById('language')!.onclick=()=>{stop();lang=lang==='ro'?'en':'ro';shell();};"
          new="document.getElementById('language')!.onclick=()=>{stop();lang=lang==='ro'?'en':'ro';localStorage.setItem('cem.ui.language',lang);shell();};"
          assert old in source
          path.write_text(source.replace(old,new,1))
          PY
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.ts
          git commit -m "UI: persist EN/RO language preference"
          git push origin HEAD:uniformize-infoclar-v1-1-shell
